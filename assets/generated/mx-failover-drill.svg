<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">MX failover drill and mailflow evidence board</title>
  <desc id="desc">A premium infrastructure evidence board showing MX hosts, sending platforms, authentication records and a safe incident handoff for small business email.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#04131a" flood-opacity=".34"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#a7d8ca" stroke-opacity=".08"/></pattern>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a22"/><stop offset=".62" stop-color="#102f38"/><stop offset="1" stop-color="#173d39"/></linearGradient>
    <linearGradient id="pulse" x1="0" x2="1"><stop offset="0" stop-color="#72e2a3"/><stop offset=".58" stop-color="#ffd36e"/><stop offset="1" stop-color="#ff8f83"/></linearGradient>
  </defs>
  <rect width="1180" height="700" rx="46" fill="#06161d"/>
  <rect x="28" y="28" width="1124" height="644" rx="36" fill="url(#grid)" stroke="#9ed9ca" stroke-opacity=".16"/>
  <g filter="url(#shadow)"><rect x="70" y="66" width="1040" height="568" rx="36" fill="url(#deep)" stroke="#9ed9ca" stroke-opacity=".24"/></g>
  <g font-family="Georgia,serif">
    <text x="112" y="132" fill="#e9fbf8" font-size="44" font-weight="700">mailflow failover drill</text>
    <text x="112" y="172" fill="#a8d8ce" font-size="21">when quotes, invoices or password resets go missing, prove the public route first</text>
  </g>
  <g transform="translate(112 222)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="956" height="112" rx="28" fill="#ffffff" fill-opacity=".07" stroke="#9ed9ca" stroke-opacity=".22"/>
    <path d="M72 56H884" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round"/>
    <g text-anchor="middle" font-weight="950" font-size="17">
      <g transform="translate(72 56)"><circle r="34" fill="#0b242b" stroke="#72e2a3" stroke-width="5"/><text y="6" fill="#e9fbf8">MX</text><text y="62" fill="#a8d8ce" font-size="13">mail route</text></g>
      <g transform="translate(275 56)"><circle r="34" fill="#0b242b" stroke="#72e2a3" stroke-width="5"/><text y="6" fill="#e9fbf8">SPF</text><text y="62" fill="#a8d8ce" font-size="13">sender list</text></g>
      <g transform="translate(478 56)"><circle r="34" fill="#0b242b" stroke="#ffd36e" stroke-width="5"/><text y="6" fill="#e9fbf8">DKIM</text><text y="62" fill="#a8d8ce" font-size="13">signature</text></g>
      <g transform="translate(681 56)"><circle r="34" fill="#0b242b" stroke="#ffd36e" stroke-width="5"/><text y="6" fill="#e9fbf8">DMARC</text><text y="62" fill="#a8d8ce" font-size="13">policy</text></g>
      <g transform="translate(884 56)"><circle r="34" fill="#0b242b" stroke="#ff8f83" stroke-width="5"/><text y="6" fill="#e9fbf8">LOG</text><text y="62" fill="#a8d8ce" font-size="13">receipt</text></g>
    </g>
  </g>
  <g transform="translate(112 390)" font-family="ui-sans-serif, system-ui, sans-serif">
    <g><rect width="292" height="144" rx="24" fill="#fffdf7"/><text x="24" y="39" fill="#2f745d" font-size="15" font-weight="950" letter-spacing=".12em">SYMPTOM</text><text x="24" y="78" fill="#132338" font-size="25" font-weight="900">mail went quiet</text><text x="24" y="112" fill="#536172" font-size="17">No guessing inside settings.</text></g>
    <g transform="translate(332)"><rect width="292" height="144" rx="24" fill="#fff4d8"/><text x="24" y="39" fill="#9c721d" font-size="15" font-weight="950" letter-spacing=".12em">EVIDENCE</text><text x="24" y="78" fill="#132338" font-size="25" font-weight="900">resolver readback</text><text x="24" y="112" fill="#6f5a2a" font-size="17">MX/TXT compared publicly.</text></g>
    <g transform="translate(664)"><rect width="292" height="144" rx="24" fill="#eaf7f2"/><text x="24" y="39" fill="#2f745d" font-size="15" font-weight="950" letter-spacing=".12em">HANDOFF</text><text x="24" y="78" fill="#132338" font-size="25" font-weight="900">safe repair order</text><text x="24" y="112" fill="#536172" font-size="17">Owner approves DNS edits.</text></g>
  </g>
  <g transform="translate(112 574)" font-family="ui-monospace, Menlo, Consolas, monospace"><rect width="956" height="42" rx="21" fill="#ffffff" fill-opacity=".08" stroke="#9ed9ca" stroke-opacity=".18"/><text x="26" y="27" fill="#a8d8ce" font-size="16">incident rule: prove public mailflow before changing records, then issue an after-change receipt</text></g>
</svg>
