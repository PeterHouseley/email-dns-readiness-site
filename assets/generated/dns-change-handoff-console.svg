<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
<title id="title">DNS change handoff console</title>
<desc id="desc">Operational DNS handoff console showing SPF, DKIM, DMARC and MX public evidence flowing into a controlled fix order and verification pass.</desc>
<defs>
  <filter id="lift" x="-12%" y="-18%" width="130%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#071a22" flood-opacity=".22"/></filter>
  <pattern id="mesh" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#9de6d5" stroke-opacity=".09"/></pattern>
  <style>
    .bg{fill:#071a22}.panel{fill:#fffdf7;stroke:#9de6d5;stroke-opacity:.24}.ink{fill:#132338}.muted{fill:#536172}.green{fill:#2f745d}.mint{fill:#dff1e9}.amber{fill:#d7a945}.red{fill:#9a4537}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;letter-spacing:.09em}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:700}.sans{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:800}
  </style>
</defs>
<rect width="1180" height="650" rx="42" class="bg"/>
<rect x="22" y="22" width="1136" height="606" rx="34" fill="url(#mesh)"/>
<circle cx="1040" cy="96" r="92" fill="none" stroke="#9de6d5" stroke-opacity=".22" stroke-width="2"/>
<circle cx="1040" cy="96" r="55" fill="none" stroke="#d7a945" stroke-opacity=".32" stroke-width="2"/>
<text x="58" y="70" class="mono" font-size="15" fill="#9de6d5">PUBLIC DNS EVIDENCE → CHANGE ORDER → VERIFY</text>
<text x="58" y="132" class="serif" font-size="58" fill="#fffdf7">Controlled handoff, not DNS guesswork.</text>
<g filter="url(#lift)">
  <rect x="60" y="184" width="310" height="360" rx="28" class="panel"/>
  <rect x="88" y="214" width="134" height="30" rx="15" class="green"/><text x="105" y="235" class="mono" font-size="13" fill="#fff">EVIDENCE</text>
  <text x="88" y="291" class="serif ink" font-size="36">What is public</text>
  <g class="sans" font-size="17">
    <rect x="88" y="326" width="228" height="44" rx="12" class="mint"/><text x="108" y="354" class="ink">SPF sender list</text>
    <rect x="88" y="386" width="228" height="44" rx="12" fill="#f5efd8"/><text x="108" y="414" class="ink">DKIM selectors</text>
    <rect x="88" y="446" width="228" height="44" rx="12" fill="#f1dfda"/><text x="108" y="474" class="ink">DMARC policy</text>
  </g>
</g>
<g filter="url(#lift)">
  <rect x="436" y="162" width="332" height="406" rx="30" fill="#fffdf7" stroke="#d7a945" stroke-opacity=".32"/>
  <rect x="466" y="196" width="158" height="30" rx="15" class="amber"/><text x="486" y="217" class="mono" font-size="13" fill="#132338">FIX ORDER</text>
  <text x="466" y="272" class="serif ink" font-size="38">Safe edit sequence</text>
  <g class="sans" font-size="16">
    <rect x="466" y="314" width="246" height="58" rx="15" fill="#f6f0df"/><text x="490" y="338" class="ink">1 · remove duplicate SPF</text><text x="490" y="359" class="muted" font-size="13">only after sender confirmation</text>
    <rect x="466" y="392" width="246" height="58" rx="15" fill="#edf6ef"/><text x="490" y="416" class="ink">2 · confirm DKIM key</text><text x="490" y="437" class="muted" font-size="13">provider-specific selector note</text>
    <rect x="466" y="470" width="246" height="58" rx="15" fill="#f1dfda"/><text x="490" y="494" class="ink">3 · staged DMARC</text><text x="490" y="515" class="muted" font-size="13">monitor before enforcement</text>
  </g>
</g>
<g filter="url(#lift)">
  <rect x="832" y="206" width="286" height="316" rx="28" fill="#102c35" stroke="#9de6d5" stroke-opacity=".34"/>
  <text x="862" y="250" class="mono" font-size="13" fill="#9de6d5">VERIFY PASS</text>
  <text x="862" y="310" class="serif" font-size="34" fill="#fffdf7">After-change check</text>
  <g class="sans" font-size="16">
    <rect x="862" y="350" width="198" height="40" rx="20" fill="#dff1e9"/><text x="883" y="376" class="ink">lookup clean</text>
    <rect x="862" y="408" width="198" height="40" rx="20" fill="#f6efd9"/><text x="883" y="434" class="ink">alignment noted</text>
    <rect x="862" y="466" width="198" height="40" rx="20" fill="#f1dfda"/><text x="883" y="492" class="ink">remaining risk</text>
  </g>
</g>
<path d="M370 360 C410 326, 426 326, 466 360" stroke="#9de6d5" stroke-width="5" stroke-dasharray="10 10" fill="none"/>
<path d="M768 360 C808 326, 822 326, 862 360" stroke="#9de6d5" stroke-width="5" stroke-dasharray="10 10" fill="none"/>
<rect x="58" y="584" width="612" height="34" rx="17" fill="#dff1e9"/><text x="82" y="606" class="mono" font-size="12" fill="#132338">NO PASSWORDS · NO INBOX ACCESS · PUBLIC RECORDS ONLY · OWNER APPROVAL BEFORE EDITS</text>
</svg>
