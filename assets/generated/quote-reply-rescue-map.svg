<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">Quote reply rescue map</title>
  <desc id="desc">A premium operational map showing a quiet quote follow-up moving through public email authentication evidence, resolver readbacks, and a safe DNS rescue order.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="145%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#06161d" flood-opacity=".30"/></filter>
    <pattern id="papergrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#173047" stroke-opacity=".07"/></pattern>
    <linearGradient id="route" x1="0" x2="1"><stop offset="0" stop-color="#9a4537"/><stop offset=".48" stop-color="#d6a43a"/><stop offset="1" stop-color="#2f745d"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a22"/><stop offset="1" stop-color="#153c38"/></linearGradient>
  </defs>
  <rect width="1180" height="700" rx="46" fill="#eef2ec"/>
  <rect x="28" y="28" width="1124" height="644" rx="34" fill="url(#papergrid)"/>
  <g filter="url(#shadow)">
    <rect x="68" y="66" width="1044" height="568" rx="34" fill="#fffdf7" stroke="#173047" stroke-opacity=".14"/>
    <rect x="744" y="104" width="320" height="492" rx="28" fill="url(#dark)"/>
  </g>
  <g font-family="Georgia,serif" fill="#132338">
    <text x="112" y="132" font-size="44" font-weight="700">quote reply rescue map</text>
    <text x="112" y="172" font-size="20" fill="#536172">when a warm sales thread goes quiet, turn DNS fog into a governed repair trail</text>
  </g>
  <g transform="translate(112 226)" font-family="ui-sans-serif, system-ui, sans-serif">
    <path d="M54 232 C180 132 290 132 414 232 S650 332 782 232" stroke="url(#route)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <g font-weight="950" text-anchor="middle">
      <g transform="translate(54 232)"><circle r="44" fill="#f1ded8" stroke="#9a4537" stroke-width="5"/><text y="7" fill="#132338" font-size="17">QUIET</text><text y="70" fill="#536172" font-size="15">quote thread</text></g>
      <g transform="translate(292 142)"><circle r="44" fill="#fff6dd" stroke="#d6a43a" stroke-width="5"/><text y="7" fill="#132338" font-size="17">CHECK</text><text y="70" fill="#536172" font-size="15">SPF/DKIM</text></g>
      <g transform="translate(532 314)"><circle r="44" fill="#e9f4ee" stroke="#2f745d" stroke-width="5"/><text y="7" fill="#132338" font-size="17">READ</text><text y="70" fill="#536172" font-size="15">resolvers</text></g>
      <g transform="translate(782 232)"><circle r="44" fill="#e9f4ee" stroke="#2f745d" stroke-width="5"/><text y="7" fill="#132338" font-size="17">FIX</text><text y="70" fill="#536172" font-size="15">safe order</text></g>
    </g>
    <g transform="translate(0 396)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect width="632" height="70" rx="18" fill="#173047"/>
      <text x="24" y="30" fill="#a7d8ca" font-size="16">OWNER-SAFE RESCUE RULE</text>
      <text x="24" y="52" fill="#fffdf7" font-size="17">public DNS evidence first · no logins · edit only after approval</text>
    </g>
  </g>
  <g transform="translate(784 146)" font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" fill="#a7d8ca" font-size="15" font-weight="950" letter-spacing=".12em">RESCUE DOCKET</text>
    <g transform="translate(0 36)" fill="#e9fbf8">
      <rect width="240" height="76" rx="18" fill="rgba(255,255,255,.08)" stroke="#9ed9ca" stroke-opacity=".22"/>
      <text x="18" y="32" font-size="16" font-weight="900">Evidence captured</text><text x="18" y="56" font-size="14" fill="#a7d8ca">TXT, MX, selector clues</text>
    </g>
    <g transform="translate(0 132)" fill="#e9fbf8">
      <rect width="240" height="76" rx="18" fill="rgba(255,255,255,.08)" stroke="#9ed9ca" stroke-opacity=".22"/>
      <text x="18" y="32" font-size="16" font-weight="900">Cause separated</text><text x="18" y="56" font-size="14" fill="#a7d8ca">platform vs policy gap</text>
    </g>
    <g transform="translate(0 228)" fill="#e9fbf8">
      <rect width="240" height="76" rx="18" fill="rgba(255,255,255,.08)" stroke="#9ed9ca" stroke-opacity=".22"/>
      <text x="18" y="32" font-size="16" font-weight="900">Repair order issued</text><text x="18" y="56" font-size="14" fill="#a7d8ca">ranked, reversible, checked</text>
    </g>
    <g transform="translate(0 350)">
      <path d="M0 0h240" stroke="#ffd36e" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="42" fill="#ffd36e" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="950">REPLY RISK: AMBER → CONTROLLED</text>
    </g>
