<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">New sender preflight manifest</title>
  <desc id="desc">A premium email infrastructure preflight board showing a new CRM, invoice app and newsletter platform checked against SPF, DKIM, DMARC alignment and approval before sending goes live.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="145%"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#071a22" flood-opacity=".28"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#173047" stroke-opacity=".08"/></pattern>
    <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#72e2a3"/><stop offset=".58" stop-color="#ffd36e"/><stop offset="1" stop-color="#ff8f83"/></linearGradient>
  </defs>
  <rect width="1180" height="680" rx="46" fill="#eef2ec"/>
  <rect x="28" y="28" width="1124" height="624" rx="34" fill="url(#grid)"/>
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1040" height="540" rx="36" fill="#fffdf7" stroke="#173047" stroke-opacity=".14"/>
  </g>
  <g font-family="Georgia,serif" fill="#132338">
    <text x="112" y="134" font-size="44" font-weight="700">new sender preflight</text>
    <text x="112" y="174" font-size="21" fill="#536172">check every CRM, invoice app and newsletter tool before it sends as the domain</text>
  </g>
  <g transform="translate(112 228)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect width="956" height="74" rx="20" fill="#173047"/>
    <g fill="#e9fbf8" font-size="15" font-weight="900" letter-spacing=".08em">
      <text x="26" y="45">SENDER</text><text x="290" y="45">AUTH CLUE</text><text x="536" y="45">RISK</text><text x="748" y="45">GO / NO-GO</text>
    </g>
    <g font-size="19" fill="#132338">
      <g transform="translate(0 96)">
        <rect width="956" height="64" rx="18" fill="#eef6f1"/>
        <text x="26" y="40" font-weight="900">Invoice platform</text><text x="290" y="40">SPF include proposed</text><text x="536" y="40">low after owner sign-off</text><text x="784" y="40" fill="#2f745d" font-weight="950">APPROVE</text>
      </g>
      <g transform="translate(0 178)">
        <rect width="956" height="64" rx="18" fill="#f7efd7"/>
        <text x="26" y="40" font-weight="900">Newsletter tool</text><text x="290" y="40">DKIM selector missing</text><text x="536" y="40">medium until verified</text><text x="784" y="40" fill="#9c721d" font-weight="950">HOLD</text>
      </g>
      <g transform="translate(0 260)">
        <rect width="956" height="64" rx="18" fill="#f1ded8"/>
        <text x="26" y="40" font-weight="900">Old CRM</text><text x="290" y="40">unknown SPF include</text><text x="536" y="40">remove only if unused</text><text x="784" y="40" fill="#98493b" font-weight="950">CONFIRM</text>
      </g>
    </g>
    <g transform="translate(0 370)">
      <path d="M40 42H916" stroke="url(#rail)" stroke-width="10" stroke-linecap="round"/>
      <g font-size="14" font-weight="950" text-anchor="middle">
        <g transform="translate(40 42)"><circle r="30" fill="#fffdf7" stroke="#2f745d" stroke-width="5"/><text y="5" fill="#173047">TXT</text></g>
        <g transform="translate(332 42)"><circle r="30" fill="#fffdf7" stroke="#2f745d" stroke-width="5"/><text y="5" fill="#173047">DKIM</text></g>
        <g transform="translate(624 42)"><circle r="30" fill="#fffdf7" stroke="#ffd36e" stroke-width="5"/><text y="5" fill="#173047">DMARC</text></g>
        <g transform="translate(916 42)"><circle r="30" fill="#fffdf7" stroke="#ff8f83" stroke-width="5"/><text y="5" fill="#173047">LIVE</text></g>
      </g>
      <text x="0" y="104" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#536172">preflight rule: no new sender goes live until public records, owner approval and rollback note are recorded</text>
    </g>
  </g>
</svg>
