<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='700' viewBox='0 0 1180 700' role='img' aria-labelledby='title desc'>
  <title id='title'>Mailbox migration cutover board</title>
  <desc id='desc'>A premium operational board showing old mailbox systems, approved senders, DNS cutover checks and public resolver receipts for an email migration.</desc>
  <defs>
    <filter id='shadow' x='-18%' y='-20%' width='136%' height='145%'><feDropShadow dx='0' dy='24' stdDeviation='20' flood-color='#04131a' flood-opacity='.32'/></filter>
    <pattern id='grid' width='36' height='36' patternUnits='userSpaceOnUse'><path d='M36 0H0v36' fill='none' stroke='#9ed9ca' stroke-opacity='.1'/></pattern>
    <linearGradient id='lane' x1='0' x2='1'><stop offset='0' stop-color='#72e2a3'/><stop offset='.52' stop-color='#ffd36e'/><stop offset='1' stop-color='#8fe1ff'/></linearGradient>
    <linearGradient id='panel' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#fffdf7'/><stop offset='1' stop-color='#e5efe9'/></linearGradient>
  </defs>
  <rect width='1180' height='700' rx='46' fill='#06161d'/>
  <rect x='28' y='28' width='1124' height='644' rx='34' fill='url(#grid)' stroke='#9ed9ca' stroke-opacity='.18'/>
  <g font-family='Georgia,serif' fill='#e9fbf8'>
    <text x='70' y='118' font-size='44' font-weight='700'>mailbox migration cutover board</text>
    <text x='70' y='158' font-size='21' fill='#a7d8ca'>before Microsoft 365, Google Workspace, CRM or form mail changes go live</text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='70' y='208' width='1040' height='390' rx='34' fill='url(#panel)'/>
  </g>
  <g font-family='ui-sans-serif,system-ui,sans-serif'>
    <path d='M148 333H1030' stroke='url(#lane)' stroke-width='12' stroke-linecap='round'/>
    <g text-anchor='middle' font-weight='950' font-size='18'>
      <g transform='translate(148 333)'><circle r='48' fill='#0b2730' stroke='#72e2a3' stroke-width='6'/><text y='6' fill='#e9fbf8'>OLD</text><text y='86' fill='#536172' font-size='16'>current records</text></g>
      <g transform='translate(368 333)'><circle r='48' fill='#0b2730' stroke='#ffd36e' stroke-width='6'/><text y='6' fill='#e9fbf8'>SPF</text><text y='86' fill='#536172' font-size='16'>sender inventory</text></g>
      <g transform='translate(588 333)'><circle r='48' fill='#0b2730' stroke='#ffd36e' stroke-width='6'/><text y='6' fill='#e9fbf8'>DKIM</text><text y='86' fill='#536172' font-size='16'>selector proof</text></g>
      <g transform='translate(808 333)'><circle r='48' fill='#0b2730' stroke='#8fe1ff' stroke-width='6'/><text y='6' fill='#e9fbf8'>MX</text><text y='86' fill='#536172' font-size='16'>mail route</text></g>
      <g transform='translate(1030 333)'><circle r='48' fill='#0b2730' stroke='#72e2a3' stroke-width='6'/><text y='6' fill='#e9fbf8'>LIVE</text><text y='86' fill='#536172' font-size='16'>resolver receipt</text></g>
    </g>
    <g transform='translate(112 478)' font-size='17' fill='#132338'>
      <rect width='292' height='74' rx='18' fill='#eef6f1'/><text x='22' y='31' font-weight='950'>1. freeze the sender list</text><text x='22' y='55' fill='#536172'>no mystery tools survive cutover</text>
      <g transform='translate(332 0)'><rect width='292' height='74' rx='18' fill='#fff4d9'/><text x='22' y='31' font-weight='950'>2. approve change order</text><text x='22' y='55' fill='#6f5a2a'>SPF, DKIM, DMARC, MX separated</text></g>
      <g transform='translate(664 0)'><rect width='292' height='74' rx='18' fill='#e9f6fb'/><text x='22' y='31' font-weight='950'>3. read back publicly</text><text x='22' y='55' fill='#536172'>Google, Cloudflare, authoritative</text></g>
    </g>
  </g>
  <g font-family='ui-monospace,Menlo,monospace'>
    <rect x='810' y='86' width='300' height='72' rx='18' fill='rgba(255,255,255,.08)' stroke='#9ed9ca' stroke-opacity='.24'/>
    <text x='834' y='118' fill='#ffd36e' font-size='16' font-weight='900'>CUTOVER STATUS: AMBER</text>
    <text x='834' y='142' fill='#e9fbf8' font-size='15'>safe to edit after owner sign-off</text>
  </g>
</svg>
