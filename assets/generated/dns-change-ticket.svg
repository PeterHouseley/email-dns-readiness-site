<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc">
  <title id="title">DNS change ticket and verification receipt</title>
  <desc id="desc">A premium operational ticket showing before evidence, approved DNS edits, propagation checks, and post-change verification for email authentication records.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#08141c" flood-opacity=".20"/></filter>
    <linearGradient id="night" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071a22"/><stop offset="1" stop-color="#173047"/></linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#eef4ea"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0v34" fill="none" stroke="#9fd7cb" stroke-opacity=".10"/></pattern>
  </defs>
  <rect width="1160" height="690" rx="42" fill="url(#night)"/>
  <rect x="24" y="24" width="1112" height="642" rx="34" fill="url(#grid)"/>
  <text x="74" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="900" letter-spacing="3" fill="#9fd7cb">DNS CHANGE TICKET / OWNER APPROVED</text>
  <text x="74" y="145" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#fffdf7">Evidence → edit order → verification receipt</text>
  <g filter="url(#shadow)">
    <rect x="74" y="188" width="318" height="360" rx="28" fill="url(#paper)"/>
    <rect x="421" y="188" width="318" height="360" rx="28" fill="url(#paper)"/>
    <rect x="768" y="188" width="318" height="360" rx="28" fill="url(#paper)"/>
  </g>
  <g font-family="Georgia, serif" font-size="30" font-weight="700" fill="#132338">
    <text x="106" y="244">Before evidence</text>
    <text x="453" y="244">Safe change note</text>
    <text x="800" y="244">After receipt</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#132338">
    <rect x="106" y="286" width="238" height="46" rx="13" fill="#eef4ea" stroke="#2f745d" stroke-opacity=".25"/><text x="126" y="316">SPF: present</text>
    <rect x="106" y="354" width="238" height="46" rx="13" fill="#f5efd8" stroke="#c89d2c" stroke-opacity=".35"/><text x="126" y="384">DKIM: selector?</text>
    <rect x="106" y="422" width="238" height="46" rx="13" fill="#f2e2dc" stroke="#9a4537" stroke-opacity=".25"/><text x="126" y="452">DMARC: p=none</text>
    <rect x="453" y="286" width="238" height="46" rx="13" fill="#fffdf7" stroke="#173047" stroke-opacity=".16"/><text x="473" y="316">1. confirm senders</text>
    <rect x="453" y="354" width="238" height="46" rx="13" fill="#fffdf7" stroke="#173047" stroke-opacity=".16"/><text x="473" y="384">2. remove obsolete</text>
    <rect x="453" y="422" width="238" height="46" rx="13" fill="#fffdf7" stroke="#173047" stroke-opacity=".16"/><text x="473" y="452">3. stage policy</text>
    <rect x="800" y="286" width="238" height="46" rx="13" fill="#eef4ea" stroke="#2f745d" stroke-opacity=".25"/><text x="820" y="316">Google DNS checked</text>
    <rect x="800" y="354" width="238" height="46" rx="13" fill="#eef4ea" stroke="#2f745d" stroke-opacity=".25"/><text x="820" y="384">Cloudflare checked</text>
    <rect x="800" y="422" width="238" height="46" rx="13" fill="#eef4ea" stroke="#2f745d" stroke-opacity=".25"/><text x="820" y="452">Client note issued</text>
  </g>
  <g fill="none" stroke="#9fd7cb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M370 370 C392 370 397 370 419 370"/><path d="M717 370 C739 370 744 370 766 370"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#d8fff6">
    <rect x="74" y="590" width="1012" height="54" rx="27" fill="#ffffff" fill-opacity=".08" stroke="#9fd7cb" stroke-opacity=".22"/>
    <text x="106" y="624" font-size="20" font-weight="800">Boundary visible: no DNS logins requested · no inbox-placement promises · no edits without owner approval</text>
  </g>
</svg>
